<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05060d" />
<meta name="description" content="RADIAN — a one-thumb arcade game. Sweep the dark, touch the light." />
<title>RADIAN</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <!-- In-game HUD -->
    <div id="hud" class="hidden">
      <div class="hud-row">
        <div class="hud-block">
          <span class="hud-label">SCORE</span>
          <span id="score" class="hud-value">0</span>
        </div>
        <div id="lives" class="lives"></div>
        <div class="hud-block right">
          <span class="hud-label">BEST</span>
          <span id="best" class="hud-value">0</span>
        </div>
      </div>
      <div id="combo" class="combo hidden"></div>
    </div>

    <!-- Title screen -->
    <div id="title" class="screen">
      <div class="screen-inner">
        <h1 class="logo">RADIAN</h1>
        <p class="tagline">Sweep the dark. Touch the light.</p>
        <button id="playBtn" class="btn">PLAY</button>
        <div class="how">
          <p><b>Hold</b> to extend the beam &nbsp;·&nbsp; <b>Release</b> to retract</p>
          <p><span class="dot good"></span> collect light &nbsp;&nbsp; <span class="dot bad"></span> avoid red &nbsp;&nbsp; <span class="dot gold"></span> bonus</p>
        </div>
        <div class="best-line">BEST <span id="titleBest">0</span></div>
      </div>
    </div>

    <!-- Game over screen -->
    <div id="over" class="screen hidden">
      <div class="screen-inner">
        <h2 class="over-title">SIGNAL LOST</h2>
        <div class="final">
          <div class="final-block">
            <span class="hud-label">SCORE</span>
            <span id="finalScore" class="final-value">0</span>
          </div>
          <div class="final-block">
            <span class="hud-label">BEST</span>
            <span id="finalBest" class="final-value">0</span>
          </div>
        </div>
        <div id="newBest" class="new-best hidden">NEW BEST!</div>
        <div id="finalStats" class="final-stats"></div>
        <button id="againBtn" class="btn">PLAY AGAIN</button>
      </div>
    </div>

    <!-- Sound toggle -->
    <button id="soundBtn" class="icon-btn" aria-label="Toggle sound">♪</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
